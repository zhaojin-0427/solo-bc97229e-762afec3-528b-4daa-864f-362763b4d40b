<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL 字段溯源 · 作业队列</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <h1>SQL 字段溯源 · 敏感列影响分析（作业队列版）</h1>
  <p class="subtitle">
    提交即固定源表结构与 SQL 并返回作业号；全部 Web 进程共用一个执行名额，
    其余作业按提交顺序排队。排队/执行中均可取消，执行满 30 秒自动中止；
    刷新页面不丢进度，执行器重启后中断作业可一键重试。只做静态溯源，不执行 SQL。
  </p>
</header>

<main class="layout">
  <section class="panel input-panel">
    <div class="field">
      <label for="schema">源表结构（每行：表名(字段1, 字段2*, …)，<code>#</code> 开头为注释）</label>
      <textarea id="schema" spellcheck="false" placeholder="customer(cust_id, mobile*)">{{ demo_schema }}</textarea>
    </div>
    <div class="field">
      <label for="sql">单条 SELECT（支持非递归 WITH / 别名 / * / 表名.* / WHERE / INNER·LEFT JOIN ON / UNION ALL）</label>
      <textarea id="sql" spellcheck="false" placeholder="WITH c AS (SELECT ... FROM ...) SELECT ...">{{ demo_sql }}</textarea>
    </div>
    <div class="actions">
      <button id="submit" type="button">提交溯源作业</button>
      <button id="reset" type="button" class="secondary">恢复示例</button>
      <span id="form-status" class="status"></span>
    </div>
    <div id="error" class="error-box" hidden></div>
    <div class="legend">
      <span class="tag tag-value">值依赖敏感</span>
      <span class="tag tag-cond">条件依赖敏感</span>
      <span class="tag tag-both">两类兼有</span>
      <span class="hint">值依赖 = 输出表达式引用（含 CASE 条件）；条件依赖 = 沿途 WHERE / JOIN ON 引用，作用于该查询块全部输出。</span>
    </div>
  </section>

  <div class="right-col">
    <section class="panel jobs-panel">
      <div class="section-title">
        作业队列
        <span id="queue-summary" class="queue-summary"></span>
      </div>
      <div id="job-list" class="job-list">
        <div class="empty-note">暂无作业，提交后在此查看队列与状态。</div>
      </div>
    </section>

    <section class="panel detail-panel">
      <div class="section-title">作业详情</div>
      <div id="job-detail">
        <div class="empty-note">点击上方作业查看状态、失败原因、输入与逐列溯源结果。</div>
      </div>
    </section>
  </div>
</main>

<script>
window.DEMO_SCHEMA = {{ demo_schema | tojson }};
window.DEMO_SQL = {{ demo_sql | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
